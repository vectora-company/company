name: Website or account improvement
description: Suggest an improvement to the Vectora company website or account experience
labels: ["enhancement", "needs-triage"]
assignees: ["brunosoares"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest improvements to the company website, public product information, or account and billing experience.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What's your current workaround?
      placeholder: "I'm trying to do X but there's no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Company website
        - Product information
        - Account dashboard
        - Billing
        - Other
    validations:
      required: true
