name: Company website bug
description: Report an issue with the Vectora company website or account dashboard
labels: ["bug", "needs-triage"]
assignees: ["brunosoares"]
body:
  - type: markdown
    attributes:
      value: |
        Please report issues reproducible on the Vectora company website or account dashboard. Do not include passwords, tokens, or payment details.

  - type: input
    id: page
    attributes:
      label: Page or feature
      description: Which page or dashboard feature is affected?
      placeholder: "Pricing, account settings, billing..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Browser and operating system
      options:
        - Chrome on Windows
        - Chrome on macOS
        - Chrome on Linux
        - Firefox
        - Safari
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear description of what's happening
      placeholder: "When I do X, Y happens instead of Z"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the affected page
        2. Perform the action
        3. Describe what happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant browser console or network errors, after removing personal data
      render: shell
