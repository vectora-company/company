ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "utils/**"
frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "messages/**"
          - "public/**"
          - "package.json"
          - "pnpm-lock.yaml"
docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "SECURITY.md"
          - "CONTRIBUTING.md"
          - ".github/DEPLOYMENT.md"
