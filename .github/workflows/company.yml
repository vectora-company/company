name: Company

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: company-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"

jobs:
  validate:
    name: Lint, types, tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The no-plan-comments hook diffs against origin/<PR base>.
          # A depth-1 checkout of the synthetic merge ref does not create that ref.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Python utilities
        uses: astral-sh/setup-uv@v10
      - name: Install pre-commit
        run: uv tool install pre-commit
      - name: Run repository hooks
        run: pre-commit run --all-files
      - name: Test release and repository utilities
        run: uv run --with pydantic --with pytest pytest utils/test_checks.py utils/test_release.py -q
      - name: Check formatting
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Production build
        run: pnpm run build

  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: Production
    concurrency:
      group: company-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured; skipping deployment."
            exit 0
          fi
          pnpm exec vercel --prod --yes --token="$VERCEL_TOKEN"

  tag-release:
    name: Tag and publish release
    needs: deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      contains(github.event.head_commit.message, 'chore(master): release ')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # As credenciais permanecem no remote para o `git push` da tag
          # autenticar com contents: write.
          token: ${{ github.token }}
          persist-credentials: true
      - name: Read released version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create tag after successful deploy
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "Vectora Company $VERSION"
            git push origin "$TAG"
          fi
      - name: Create GitHub Release, rotate release lines and prepare the next release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "Vectora Company $VERSION"               --generate-notes
          fi
          gh workflow run rotate-release-lines.yml             --repo "$GITHUB_REPOSITORY" --ref master             --field "release_tag=$TAG" --field "target_branch=master"
          gh workflow run release-please.yml             --repo "$GITHUB_REPOSITORY" --ref master
