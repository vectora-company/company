name: Company

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: company-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"

jobs:
  validate:
    name: Lint, types, tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Python utilities
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install pre-commit
        run: uv tool install pre-commit
      - name: Run repository hooks
        run: pre-commit run --all-files
      - name: Test repository utilities
        run: uv run --with pytest pytest utils/test_checks.py utils/test_workflows.py -q
      - name: Check formatting
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Production build
        run: pnpm run build

  deploy:
    name: Deploy production (Vercel)
    runs-on: ubuntu-24.04
    needs: validate
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    environment: Production
    concurrency:
      group: company-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_QyvhqspWoNomZoPXeilkvq7e
      VERCEL_PROJECT_ID: prj_cuaZ7zokfupgW2A1FAPwtAMtYGsI
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Set up Python utilities
        uses: astral-sh/setup-uv@v10.3.3
      - name: Link the production Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Configure the VERCEL_TOKEN repository secret before deploying."
            exit 1
          fi
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"vectora-company"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
      - name: Deploy through the production SCons target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: uv tool run --with scons scons prod
