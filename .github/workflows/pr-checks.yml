name: PR Checks

# Valida que o TÍTULO do PR segue Conventional Commits para manter o histórico
# de merge legível. O deploy de produção acontece só depois que a mudança entra
# em master ou main. Mesmo padrão de
# lancedb/.github/workflows/dev.yml.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches: ["**"]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-tests:
    name: Repository tooling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          all-extras: "false"
          working-directory: .
      - name: Run repository utility tests
        run: uv run pytest -q utils/test_checks.py utils/test_workflows.py

  commitlint:
    name: Verify PR title (Conventional Commits)
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: >-
          npm install --no-save --no-audit --no-fund
          @commitlint/cli@21.2.4
          @commitlint/config-conventional@21.2.4
      # body-max-line-length/footer-max-line-length/body-leading-blank
      # desligadas: o GitHub sempre garante linha em branco entre título e
      # corpo, e quebra o corpo em linhas curtas — essas regras dariam falso
      # positivo em qualquer PR com descrição normal.
      - run: >
          echo 'module.exports = {
            extends: ["@commitlint/config-conventional"],
            rules: {
              "body-max-line-length": [0, "always", Infinity],
              "footer-max-line-length": [0, "always", Infinity],
              "body-leading-blank": [0, "always"]
            }
          }' > .commitlintrc.js
      # Sem `--edit`: essa flag espera um COMMIT_EDITMSG de verdade dentro
      # de um repo git ("Could not find git root" sem checkout) — pra
      # validar uma string solta (o título do PR, não um commit real),
      # o jeito certo é ler de stdin sem flag nenhuma.
      - run: npx commitlint --verbose <<< "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const message = [
              "**Título do PR fora do padrão**",
              "",
              "Este repositório usa [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) para manter títulos e histórico de merge consistentes.",
              "",
              "Exemplos válidos: `feat: adiciona X`, `fix(updates): corrige Y`, `docs: atualiza Z`.",
              "",
              "Ajuste o título do PR para corrigir.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const already = comments.some((c) => c.body === message);
            if (!already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }
            core.setFailed(message);

  no-plan-metadata:
    name: Sem Sprint/Bloco/Fase ou menção a ferramenta de IA em título/descrição do PR
    # Sem `permissions: pull-requests: write` aqui de propósito: este job já
    # roda com o título/corpo do PR (dado potencialmente hostil, ex. fork).
    # Comentar no PR exige escrita; quem comenta é o job trusted em
    # pr-checks-comment.yml (workflow_run, contexto do branch base) — nunca
    # o job que processa dado da PR direto.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: check
        run: python utils/checks.py pr-metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Registra o número do PR pro job de comentário
        if: failure() && steps.check.conclusion == 'failure'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: Upload do número do PR (consumido pelo job trusted)
        if: failure() && steps.check.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: no-plan-metadata-failure
          path: pr-number.txt
          retention-days: 1
