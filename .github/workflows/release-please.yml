name: Release Please

on:
  push:
    branches:
      - master
      - "release/**"
  workflow_dispatch:

concurrency:
  group: company-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Prepare release pull request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      - name: Ensure release label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "autorelease: pending" \
            --repo "$GITHUB_REPOSITORY" \
            --color "0E8A16" \
            --description "Release PR awaiting merge" \
            --force
      - name: Resolve configured line
        id: line
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          uv run --with pydantic python utils/release.py line "$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Plan and update release line
        if: steps.line.outputs.enabled == 'true'
        id: plan
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          series="${current%.*}"
          tag="$(git tag --merged "origin/$BRANCH" --list "v${series}.*" --sort=-version:refname | head -n 1)"
          if [[ -n "$tag" ]]; then
            range="$tag..origin/$BRANCH"
          else
            range="$(git rev-list --max-parents=0 "origin/$BRANCH" | tail -n 1)..origin/$BRANCH"
          fi
          git log --format='%s%x1f%b%x1e' "$range" |
            jq -R -s 'split("\u001e") | map(select(length > 0)) | map({subject: (split("\u001f")[0]), body: (split("\u001f")[1] // "")})' \
            > "$RUNNER_TEMP/release-commits.json"
          uv run --with pydantic python utils/release.py plan \
            --current-version "$current" \
            --commits-json "$RUNNER_TEMP/release-commits.json" \
            --files package.json > "$RUNNER_TEMP/release-plan.json"
          next="$(jq -er '.next_version' "$RUNNER_TEMP/release-plan.json")"
          bump="$(jq -er '.bump' "$RUNNER_TEMP/release-plan.json")"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          if [[ "$bump" == "none" ]]; then exit 0; fi

          if [[ "$BRANCH" == "master" ]]; then
            release_branch="release/$next"
          else
            release_branch="$BRANCH"
          fi
          git switch -C "$release_branch" "origin/$BRANCH"
          # Apply the same deterministic plan on the release branch.
          uv run --with pydantic python utils/release.py plan \
            --current-version "$current" \
            --commits-json "$RUNNER_TEMP/release-commits.json" \
            --files package.json --apply >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(master): release $next"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ "$release_branch" == "$BRANCH" ]]; then
            git push origin "HEAD:$release_branch"
          else
            git push --force-with-lease origin "HEAD:$release_branch"
          fi

          body="$RUNNER_TEMP/release-pr-body.md"
          uv run --with pydantic python utils/release.py pr-body CHANGELOG.md "$body"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$release_branch" --base master --state open --json number --jq '.[0].number // empty')"
          milestone="${{ steps.line.outputs.maintenance_milestone }}"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "chore(master): release $next" --body-file "$body" --milestone "$milestone" --add-label "autorelease: pending"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$release_branch" --title "chore(master): release $next" --body-file "$body" --milestone "$milestone" --label "autorelease: pending"
          fi
