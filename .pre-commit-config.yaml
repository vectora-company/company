default_stages: [pre-commit]
minimum_pre_commit_version: 4.0.0

exclude: |
  (?x)^(
    \.git/.*|
    .*\.lock$|
    .*\.pdf$|
    coverage\..*|
    \.env.*|
    node_modules/.*|
    \.output/.*|
    dist/.*|
    \.venv/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: translation-key-order
        name: Validate translation key order
        entry: python utils/checks.py translation-keys --check
        language: system
        pass_filenames: false
        always_run: true
      - id: removed-path-references
        name: Reject references to removed or renamed files
        entry: python utils/checks.py removed-paths
        language: system
        pass_filenames: false
        always_run: true
      - id: no-plan-pr-metadata
        name: Reject process metadata in source comments
        entry: python utils/checks.py no-plan
        language: system
        types_or: [python, javascript, jsx, ts, tsx]
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|css|md|ya?ml)$
        types_or: [text]
      - id: paraglide-compile
        name: Generate Paraglide i18n types
        entry: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide
        language: system
        pass_filenames: false
        always_run: true
      - id: typescript
        name: TypeScript typecheck
        entry: pnpm run typecheck
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
      - id: oxlint
        name: Oxlint
        entry: pnpm run lint
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false
      - id: release-lines-config
        name: Validate release line configuration
        entry: uv run --with pydantic python utils/release.py line master
        language: system
        files: ^\.github/release-lines\.json$
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        files: ^\.github/workflows/.*\.ya?ml$

ci:
  autofix_commit_msg: "chore: auto fixes from pre-commit hooks"
  autofix_prs: false
  autoupdate_branch: ""
  skip: []
  submodules: false
